name: Build iOS Native IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile SwiftUI Native App
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -target arm64-apple-ios16.0 \
            -sdk "$SDKROOT" \
            -framework SwiftUI \
            -framework UIKit \
            -framework Network \
            -parse-as-library \
            -O \
            CamScanner/CamScannerApp.swift CamScanner/ContentView.swift \
            -o CamScannerBinary

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload/CamScanner.app
          cp CamScannerBinary Payload/CamScanner.app/CamScanner
          cp CamScanner/Info.plist Payload/CamScanner.app/Info.plist
          chmod +x Payload/CamScanner.app/CamScanner
          zip -r CamScanner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamScanner-App
          path: CamScanner.ipa